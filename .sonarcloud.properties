# Read by SonarCloud's AUTOMATIC ANALYSIS. The conventional
# sonar-project.properties is read by the scanner CLI and ignored here — tried
# on PR #1943, and the same findings came back unchanged.

# Copy-paste detection off for the static site.
#
# site/ is plain HTML served by GitHub Pages with no build step, so there is no
# include or template mechanism. Every one of its 21 pages carries the same
# ~87-line <head> and sidebar by construction. Adding one sidebar link to each
# page made 14 files report 100% duplication on their single new line, and a
# new page reports ~14% before it says anything at all.
#
# That is the site's architecture, not a defect a page author can fix. Removing
# the duplication means adopting a static-site generator, which is a separate
# decision. Only copy-paste detection is disabled; bugs and code smells in
# site/ are still reported, and tools/site-lint.sh checks links, markup and the
# sitemap on every push.
sonar.cpd.exclusions=site/**

# Deliberately-broken lint fixtures. A missing <title> in
# tools/lib/testdata/site-lint/broken/ is the fixture working, not a finding.
# Belt and braces: those files also ship with a .in suffix so no HTML analyser
# reads them.
sonar.exclusions=**/testdata/**
