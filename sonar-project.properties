# SonarCloud runs Automatic Analysis on this repository; this file carries the
# exclusions that analysis cannot infer.
#
# testdata/ directories hold DELIBERATELY BROKEN fixtures. Every lint gate in
# tools/ owes a mutation corpus — a miniature input that must make the gate go
# red — so "this file has a defect" is the fixture working, not a finding.
# tools/lib/testdata/site-lint/broken/index.html has no <title> on purpose: it
# is how tools/lib/site-lint_test.sh proves the missing-title check fires.
# Scanned, those files report as bugs and their near-identical siblings report
# as duplication, and both readings are exactly backwards.
#
# Scoped to testdata/ alone. Production code, including every gate script that
# reads these fixtures, stays analysed.
sonar.exclusions=**/testdata/**
sonar.cpd.exclusions=**/testdata/**
