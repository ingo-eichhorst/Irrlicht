disabled_skills = []
experimental_enable_registry_skills = false
applied_migrations = [
    "bash_read_only_defaults_v1",
]

[experiment_overrides]

[[providers]]
name = "mistral"
api_base = "https://api.mistral.ai/v1"
api_key_env_var = "MISTRAL_API_KEY"
browser_auth_base_url = "https://console.mistral.ai"
browser_auth_api_base_url = "https://console.mistral.ai/api"
api_style = "openai"
backend = "mistral"
reasoning_field_name = "reasoning_content"
project_id = ""
region = ""

[providers.extra_headers]

[[providers]]
name = "llamacpp"
api_base = "http://127.0.0.1:8080/v1"
api_key_env_var = ""
api_style = "openai"
backend = "generic"
reasoning_field_name = "reasoning_content"
project_id = ""
region = ""

[providers.extra_headers]

[[models]]
name = "mistral-vibe-cli-latest"
provider = "mistral"
alias = "mistral-medium-3.5"
temperature = 1.0
input_price = 1.5
output_price = 7.5
thinking = "high"
supports_images = true
auto_compact_threshold = 200000

[[models]]
name = "devstral-small-latest"
provider = "mistral"
alias = "devstral-small"
temperature = 0.2
input_price = 0.1
output_price = 0.3
thinking = "off"
supports_images = false
auto_compact_threshold = 200000

[[models]]
name = "devstral"
provider = "llamacpp"
alias = "local"
temperature = 0.2
input_price = 0.0
output_price = 0.0
thinking = "off"
supports_images = false
auto_compact_threshold = 200000

[[transcribe_providers]]
name = "mistral"
api_base = "wss://api.mistral.ai"
api_key_env_var = "MISTRAL_API_KEY"
client = "mistral"

[[transcribe_models]]
name = "voxtral-mini-transcribe-realtime-2602"
provider = "mistral"
alias = "voxtral-realtime"
sample_rate = 16000
encoding = "pcm_s16le"
language = "en"
target_streaming_delay_ms = 500

[[tts_providers]]
name = "mistral"
api_base = "https://api.mistral.ai"
api_key_env_var = "MISTRAL_API_KEY"
client = "mistral"

[[tts_models]]
name = "voxtral-mini-tts-latest"
provider = "mistral"
alias = "voxtral-tts"
voice = "gb_jane_neutral"
response_format = "wav"

[project_context]
default_commit_count = 5
timeout_seconds = 2.0

[experiments]
enable = true
api_host = "https://experiments.mistral.services/"
client_key = "sdk-REDACTED-BY-IRRLICHT-FIXTURE"

[session_logging]
save_dir = "/Users/ingo/.vibe/logs/session"
session_prefix = "session"
enabled = true

[tools.skill]
permission = "always"
allowlist = []
denylist = []
sensitive_patterns = []

[tools.exit_plan_mode]
permission = "always"
allowlist = []
denylist = []
sensitive_patterns = []

[tools.task]
permission = "ask"
allowlist = [
    "explore",
]
denylist = []
sensitive_patterns = []

[tools.web_fetch]
permission = "ask"
allowlist = []
denylist = []
sensitive_patterns = []
default_timeout = 30
max_timeout = 120
max_content_bytes = 120000
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

[tools.bash]
permission = "ask"
allowlist = [
    "/Users/ingo/.local/share/uv/tools/mistral-vibe/lib/python3.12/site-packages/vibe/core/prompts/*",
    "/Users/ingo/.vibe/logs/session/*",
