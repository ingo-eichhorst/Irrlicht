<!-- @dsCard group="Elfdans" name="Pairing — phone side" subtitle="Code entry inside the installed app" viewport="430x780" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Elfdans — pairing (phone side) — Irrlicht design system</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&family=DM+Mono:wght@300;400;500&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#050a14;color:#c8cdd8;font-family:'Outfit',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
body::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.025;z-index:999;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.phone{width:390px;background:#070d1a;border:1px solid rgba(138,92,246,.12);border-radius:32px;padding:26px 22px 30px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:22px}
.phone::before{content:'';position:absolute;top:-120px;left:50%;transform:translateX(-50%);width:420px;height:280px;background:radial-gradient(ellipse at center,#0d1424 0%,transparent 70%);pointer-events:none}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:18px;position:relative}
.dot{width:8px;height:8px;border-radius:50%;background:#8B5CF6;box-shadow:0 0 20px #8B5CF6,0 0 60px rgba(139,92,246,.3);animation:breathe 3s cubic-bezier(.16,1,.3,1) infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.2);opacity:.7}}
.wordmark{font-family:'DM Mono',monospace;font-weight:500;font-size:.82rem;letter-spacing:.25em;text-transform:uppercase;color:#e8ecf4}
.wordmark b{color:#8B5CF6;font-weight:500}
.tag{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;font-size:1.15rem;color:#5a6378}
.install{display:flex;gap:10px;background:rgba(255,149,0,.12);border:1px solid rgba(255,149,0,.2);border-radius:10px;padding:12px 14px;font-weight:300;font-size:.82rem;color:#c8cdd8;position:relative}
.install .g{color:#FF9500;font-family:'DM Mono',monospace}
.entry{display:flex;flex-direction:column;gap:10px;position:relative}
.label{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.3em;text-transform:uppercase;color:#5a6378}
.codein{display:flex;align-items:center;justify-content:center;gap:2px;background:#060d1a;border:1px solid rgba(139,92,246,.25);border-radius:10px;padding:16px;font-family:'DM Mono',monospace;font-weight:500;font-size:1.9rem;letter-spacing:.18em;color:#e8ecf4}
.codein .dash{color:#8B5CF6}
.codein .caret{width:2px;height:1.6em;background:#8B5CF6;animation:blink 1.1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.pair{appearance:none;border:0;border-radius:10px;padding:14px;font-family:'Outfit',sans-serif;font-weight:500;font-size:.95rem;color:#e8ecf4;background:linear-gradient(180deg,#8B5CF6,#6d3fe0);box-shadow:0 0 20px rgba(139,92,246,.35);cursor:pointer}
.quiet{font-weight:300;font-size:.78rem;color:#5a6378;text-align:center}
.quiet code{font-family:'DM Mono',monospace;font-size:.72rem;color:#c8cdd8}
.foot{margin-top:auto;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;font-size:.95rem;color:#5a6378}
</style>
</head>
<body>
<div class="phone">
  <div class="brand">
    <div class="dot"></div>
    <div class="wordmark">irr<b>licht</b> elfdans</div>
    <div class="tag">a light in your pocket</div>
  </div>
  <div class="install"><span class="g">&#9888;</span><span>not installed yet &mdash; share&nbsp;&rarr;&nbsp;<span class="g">add to home screen</span>, then open elfdans from there. iOS only delivers push to installed apps.</span></div>
  <div class="entry">
    <div class="label">pairing code</div>
    <div class="codein">KX4M<span class="dash">&ndash;</span>7R<span class="caret"></span></div>
    <button class="pair">pair this phone</button>
    <div class="quiet">the code came from the dashboard on your mac &mdash; <code>settings &rarr; elfdans</code></div>
  </div>
  <div class="foot">one pairing &mdash; then it just glows.</div>
</div>
</body>
</html>
