name: Two jobs, one with defaults and one without
on: [push]
jobs:
  strict:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Step in the strict job
        run: |
          echo one
  loose:
    runs-on: ubuntu-latest
    steps:
      - name: Step in the loose job
        run: |
          echo two
