name: Linux

# Real Linux build+test gate. coverage.yml runs `go test ./...` on ubuntu but
# pipes it to >/dev/null and ignores the exit code (it only scrapes a coverage
# %), which is why monitor.go failing to compile on Linux went unnoticed
# (#478). This job builds and tests and FAILS on any compile/test error.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token — this job only builds and tests. Runs on fork PRs, so don't
# inherit the repo-default (often write) scope.
permissions:
  contents: read

# Don't pile up redundant multi-minute -race runs on rapid pushes.
concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # POSIX-sh gate (#1423). This job is the host because ubuntu is the only
      # runner where the property can actually be tested: `/bin/sh` here is
      # dash, and the image ships shellcheck (0.9.0). test.yml's `go-test` job
      # cannot host it — that job is pinned to macos-latest for the macOS
      # runtime paths in `go test ./core/...` (kqueue exit-watch, pgrep/lsof
      # discovery), and the macos image ships no shellcheck at all, so the
      # gate would have to `brew install` a linter on every PR to check two
      # files. Runs before setup-go: it needs no toolchain, takes well under a
      # second, and behind the Go steps a compile error would abort the job
      # and leave an installer-only PR with no installer feedback.
      #
      # site/install.sh reaches users as `curl … | sh`, which on Debian and
      # Ubuntu is dash — so a bashism here lands on a new user's first
      # command, before anything is installed that could report it.
      - name: Lint POSIX sh scripts
        run: tools/posix-lint.sh

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache: false

      - name: Build (linux)
        run: cd core && go build ./...

      - name: Test (linux, race)
        # Includes the headless daemon smoke test and the /proc+pidfd
        # observer-conformance test (processlifecycle, //go:build linux).
        run: cd core && go test ./... -race -count=1

      - name: Replay fixtures (golden byte-identity, OS-neutral)
        run: tools/replay-fixtures.sh
