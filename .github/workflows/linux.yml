name: Linux

# Real Linux build+test gate. coverage.yml runs `go test ./...` on ubuntu but
# pipes it to >/dev/null and ignores the exit code (it only scrapes a coverage
# %), which is why monitor.go failing to compile on Linux went unnoticed
# (#478). This job builds and tests and FAILS on any compile/test error.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token — this job only builds and tests. Runs on fork PRs, so don't
# inherit the repo-default (often write) scope.
permissions:
  contents: read

# Don't pile up redundant multi-minute -race runs on rapid pushes.
concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # POSIX-sh gate (#1423). This job is the host because ubuntu is the only
      # runner where the property can actually be tested: `/bin/sh` here is
      # dash, and the image ships shellcheck (0.9.0). test.yml's `go-test` job
      # cannot host it — that job is pinned to macos-latest for the macOS
      # runtime paths in `go test ./core/...` (kqueue exit-watch, pgrep/lsof
      # discovery), and the macos image ships no shellcheck at all, so the
      # gate would have to `brew install` a linter on every PR to check two
      # files. Runs before setup-go: it needs no toolchain, takes well under a
      # second, and behind the Go steps a compile error would abort the job
      # and leave an installer-only PR with no installer feedback.
      #
      # site/install.sh reaches users as `curl … | sh`, which on Debian and
      # Ubuntu is dash — so a bashism here lands on a new user's first
      # command, before anything is installed that could report it.
      - name: Lint POSIX sh scripts
        run: tools/posix-lint.sh

      # The gate's own unit tests, over the deliberately-broken corpus under
      # tools/lib/testdata/posix-lint/. They live here rather than in test.yml's
      # `tools/lib/*_test.sh` loop for the same reason the gate does: they need
      # a static bashism linter, and the macos image ships none. A gate that
      # passes by construction is what #1423 is about, so the mutation corpus
      # has to run somewhere — this is where it can.
      - name: Test the POSIX-sh gate
        run: bash tools/lib/posix-lint_test.sh

      # BASH gate (#1684) — the sibling of the two steps above, over the OTHER
      # shell family. 83 bash files / ~19k lines that no static linter read at
      # all: the bounded gate runner (tools/lib/gate-budget.sh), the pre-push
      # hook's own scoping rules (changed-files.sh), the shared suite runner and
      # every extract-and-execute workflow lock. posix-lint.sh selects on a
      # `#!/bin/sh` FIRST LINE, deliberately (#1611), so every bash file fell
      # outside it — the same file-selection blindness class as #1423 and #1611.
      #
      # THIS JOB IS THE HOST FOR A DIFFERENT REASON THAN posix-lint.sh's, and
      # the difference matters. That gate needs ubuntu because `/bin/sh` must
      # genuinely BE dash here — the property under test is a property of the
      # runtime. shellcheck is a static analyser over the bash language and
      # reads no interpreter at all: measured, a 0.9.0 x86_64 binary under
      # Rosetta on arm64 macOS and a native arm64 0.11.0 return byte-identical
      # findings at this gate's severity floor, so neither the OS nor the arch
      # enters the verdict. What picks this job is only that the ubuntu image
      # ships shellcheck (0.9.0) and macos-latest ships none, so hosting it in
      # test.yml would `brew install` one on every PR.
      #
      # The version split is why the floor is `warning` and not `style`: at
      # `warning` all of 0.9.0 / 0.10.0 / 0.11.0 agree byte-for-byte over the
      # whole corpus, while at `style` this runner's 0.9.0 reports 138 findings
      # a developer's 0.11.0 cannot produce (137 × SC2317) against 25 the other
      # way (SC2329) — a preflight that passes a diff this job rejects, which is
      # the round-trip posix-lint.sh's monotonicity argument exists to prevent.
      # tools/bash-lint.sh's header carries the full measurement.
      #
      # Runs before setup-go for the same reason as the two above: no toolchain,
      # a couple of seconds, and behind the Go steps a compile error would abort
      # the job and leave a tooling-only PR with no tooling feedback.
      - name: Lint bash scripts
        run: tools/bash-lint.sh

      # The gate's own unit tests, over the deliberately-broken corpus under
      # tools/lib/testdata/bash-lint/. Here rather than in test.yml's
      # `tools/lib/*_test.sh` loop for the same reason posix-lint_test.sh is:
      # they need shellcheck, and the macos image ships none. A gate that passes
      # by construction is what #1684 is about, so the mutation corpus has to
      # run somewhere — this is where it can.
      - name: Test the bash-lint gate
        run: bash tools/lib/bash-lint_test.sh

      # STATE-VOCABULARY gate (#1804) — the third repo-wide lint in this job,
      # and it is here for the reason the two above are here rather than for
      # their host-specific one. posix-lint and bash-lint need ubuntu (dash as
      # a real /bin/sh; an image that ships shellcheck). This one needs nothing
      # the macos image lacks — it needs a JOB AT ALL, which it did not have:
      # until now `tools/state-vocabulary-lint.sh` was reachable only through
      # tools/preflight.sh's `tools` gate, i.e. only through the pre-push hook.
      #
      # ONE STEP, NOT TWO, and the asymmetry with the pairs above is
      # deliberate. Their unit tests are in this file because they need
      # shellcheck; this gate's tests
      # (tools/lib/state-vocabulary-lint_test.sh) need nothing, so they are
      # already picked up by test.yml's `tools/lib/*_test.sh` loop. What was
      # missing was never the tests — CI proved the lint WORKS — it was the
      # lint actually reading the repo. Nothing proved the repo PASSES it.
      #
      # That is the same argument test.yml makes over its shell-lib loop: a
      # check whose only local gate is the pre-push hook rides on a gate that
      # `git push --no-verify` disables. Not hypothetical — the PR that added
      # this step was itself pushed with --no-verify, because the hook's 540s
      # budget kills the Swift gate. A gate reachable only through a hook
      # people routinely disable is a gate that drifts, and this one exists to
      # catch the enumeration class that produced four separate defects in
      # #1796.
      #
      # CI runs the same script preflight's `tools` gate runs, so the two judge
      # a run by one implementation rather than by two that can disagree — the
      # reason test.yml and macos-swift.yml both give for sharing their
      # runners.
      #
      # Incidental benefit of running it here: this is the only place the
      # matcher meets a NON-macOS awk (mawk or gawk, not BWK awk). An awk that
      # matched differently could not fail quietly — under-matching retires
      # waivers, and a waiver that matches no site is itself an error — so the
      # gate's two-directional waiver check doubles as a cross-awk conformance
      # check for free.
      - name: Lint the session-state vocabulary
        run: tools/state-vocabulary-lint.sh

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache: false

      - name: Build (linux)
        run: cd core && go build ./...

      - name: Test (linux, race)
        # Includes the headless daemon smoke test and the /proc+pidfd
        # observer-conformance test (processlifecycle, //go:build linux).
        run: cd core && go test ./... -race -count=1

      - name: Replay fixtures (golden byte-identity, OS-neutral)
        run: tools/replay-fixtures.sh
