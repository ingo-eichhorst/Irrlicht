name: Tests

# Pass/fail gate for Go tests on every PR and on pushes to main. This is the
# enforcement the coverage workflow never provided: coverage.yml runs only on
# push-to-main, covers the `core` module alone, and swallows test failures
# (it parses coverage out of a discarded run). Without this, the module tests —
# including the onboarding-factory matrix/shard/validate suites — were verified
# locally only and could not block a PR.
#
# core and onboarding-factory are exercised. They share a go.work, so the
# runner resolves cross-module packages without per-module `go mod download`.

on:
  pull_request:
  push:
    branches: [main]

# Checkout is the only thing the default token is used for here — no job
# writes back to the repo, comments on a PR, or publishes anything.
permissions:
  contents: read

jobs:
  go-test:
    # macOS gate — the platform developers build and run on, and where the
    # macOS-only paths (kqueue exit-watch, pgrep/lsof discovery, the menu-bar
    # app) actually execute. The Linux build+test gate lives in linux.yml
    # (#478 made core cross-platform via build-tagged process observation, so
    # it now compiles and tests on Linux too). coverage.yml runs on ubuntu but
    # silently swallows failures, so it is not a gate.
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Reads .claude/skills/**/*.md (and any other SKILL.md), which no gate
      # read until #1209 — see the header of tools/skill-lint.sh for why.
      # Runs first, before setup-go: it needs no toolchain and takes a fraction
      # of a second, and behind the Go suites a `go test` failure would abort
      # the job and leave a skills-only PR with no skill feedback at all.
      - name: Lint skill files
        run: tools/skill-lint.sh

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      # Formatting gate (#629): plain gofmt over every Go tree so drift can't
      # re-accumulate. Runs before the test steps so unformatted code fails
      # fast and cheap. Prints the offending files in the failure message.
      - name: gofmt check
        run: |
          unformatted=$(gofmt -l core/ tools/)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            # Workflow-command messages are single-line: collapse the file list
            # so the annotation shows the full fix command, not just file one.
            echo "::error::gofmt found unformatted files. Run: gofmt -w $(echo "$unformatted" | tr '\n' ' ')"
            exit 1
          fi

      # core carries the headless daemon smoke test + concurrency paths, so it
      # runs under -race (matches the documented local command in AGENTS.md).
      - name: Test core module
        run: go test ./core/... -race -count=1

      # tools/onboarding-factory holds the `of` factory CLI + the viewer +
      # replay/validate/matrix/shard packages (#510/#521).
      - name: Test onboarding-factory module
        run: go test ./tools/onboarding-factory/... -count=1

      # `of validate` is the factory's schema + referential-integrity gate over
      # replaydata/ (the catalog's 5-field scenarios, every cell metadata.json,
      # expected.jsonl presence, recording ownership). It is the single sanctioned
      # writer's read-back check, so a hand-edit that bypassed `of` fails here.
      - name: Validate replaydata (of validate)
        run: go run ./tools/onboarding-factory/cmd/of validate

      # The recording-rig shell scripts aren't exercised by `go test` /
      # replay-fixtures (those replay static transcripts without driving), so
      # smoke-test is their only automated coverage: bash -n + the lib unit tests.
      - name: Smoke-test the recording rig
        run: bash tools/onboarding-factory/scripts/smoke-test.sh

      # tools/lib/ holds the scoping rules for tools/preflight.sh --changed,
      # the pre-push hook. Their local gate is that same hook, which
      # `git push --no-verify` disables — so CI has to run them independently,
      # or the checks guarding the gate ride on the gate they guard.
      #
      # The loop lives in tools/lib/shell-lib-suite.sh, which tools/preflight.sh's
      # `tools` gate calls too — ONE implementation, for the reason
      # macos-swift.yml gives for sharing swift-suite.sh: CI and the pre-push
      # hook judge a run by the same rules rather than by two implementations
      # that can disagree. They did disagree, and this was the wrong half
      # (#1639): the loop was written inline here with no `|| rc=1`, and this
      # file declares no `shell:` and no `defaults:`, so it ran under GitHub's
      # default for such a step — `bash -e {0}`, errexit ONLY (measured, run
      # 31960152598; `bash --noprofile --norc -eo pipefail` is what a step
      # DECLARING `shell: bash` gets, and this comment claimed it until
      # #1650). The FIRST failing file
      # aborted the step, every later file in glob order never ran, and nothing
      # in the log distinguished that from a clean run — one push per red file.
      # The runner prints a census (found / skipped / ran / failed) and refuses
      # an empty corpus, so "it all passed" cannot be read off a loop that
      # stopped early or found nothing.
      #
      # posix-lint_test.sh drives tools/posix-lint.sh, which REQUIRES a static
      # bashism linter and refuses to pass without one (#1423 is about a gate
      # that passed having checked nothing, so it fails rather than skipping).
      # This runner is macos-latest, whose image ships neither shellcheck nor
      # checkbashisms — which is the same reason the gate itself lives in
      # linux.yml. Both run there. Installing a linter here would cost every PR
      # 20-40s to re-test what linux.yml already tested. Naming it as a skip
      # ARGUMENT rather than as a `case` pattern in a copied loop is what makes
      # it fail loudly if it ever stops matching a real file.
      #
      # bash-lint_test.sh (#1684) is skipped for exactly the same reason — it
      # drives tools/bash-lint.sh, which refuses without shellcheck — and
      # linux.yml runs both it and its gate. It is a SECOND argument rather than
      # a second loop, and shell_lib_suite_run validates every name in the list
      # against the corpus before running anything, so a skip that stopped
      # matching a real file is a refusal rather than a quiet no-op.
      #
      # `|| rc=$?` rather than a bare call: it is the spelling that keeps the
      # status under the `-e` above (`|| true` would not — it hands back
      # `true`'s status, silently reporting every failing run as 0).
      - name: Test the shared shell libs
        run: |
          rc=0
          . tools/lib/shell-lib-suite.sh
          shell_lib_suite_run tools/lib posix-lint_test.sh bash-lint_test.sh || rc=$?
          exit "$rc"
