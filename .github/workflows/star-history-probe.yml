name: Star History Token Probe

# TEMPORARY diagnostic workflow — deleted before this branch merges.
# Determines which (token, API) combinations can read starred_at data.

on:
  push:
    branches: [ci/star-history-probe]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Probe
        env:
          GH_DEFAULT: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.STARHISTORY_TOKEN }}
        run: |
          probe_rest() {
            echo "--- REST stargazers star+json with $1"
            curl -sS -w "\nHTTP %{http_code}\n" \
              -H "Accept: application/vnd.github.star+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Authorization: Bearer $2" \
              "https://api.github.com/repos/ingo-eichhorst/Irrlicht/stargazers?per_page=1" \
              | head -c 600
            echo
          }
          probe_graphql() {
            echo "--- GraphQL stargazers with $1"
            curl -sS -w "\nHTTP %{http_code}\n" \
              -H "Authorization: Bearer $2" \
              -H "Content-Type: application/json" \
              -d '{"query":"{ repository(owner:\"ingo-eichhorst\", name:\"Irrlicht\") { stargazers(first:2, orderBy:{field:STARRED_AT, direction:ASC}) { totalCount edges { starredAt } } } }"}' \
              https://api.github.com/graphql | head -c 600
            echo
          }
          probe_identity() {
            echo "--- GET /rate_limit (auth check) with $1"
            curl -sS -w "\nHTTP %{http_code}\n" \
              -H "Authorization: Bearer $2" \
              https://api.github.com/rate_limit | head -c 200
            echo
          }

          for pair in "GITHUB_TOKEN:$GH_DEFAULT" "STARHISTORY_TOKEN:$GH_PAT"; do
            name="${pair%%:*}"; tok="${pair#*:}"
            if [ -z "$tok" ]; then echo "=== $name is EMPTY"; continue; fi
            echo "=== $name"
            probe_identity "$name" "$tok"
            probe_rest "$name" "$tok"
            probe_graphql "$name" "$tok"
          done

          echo "--- REST unauthenticated"
          curl -sS -w "\nHTTP %{http_code}\n" \
            -H "Accept: application/vnd.github.star+json" \
            "https://api.github.com/repos/ingo-eichhorst/Irrlicht/stargazers?per_page=1" | head -c 400
          echo
