name: TEMP xcode-pin probe (#1615)

# THROWAWAY. Delete before this PR merges.
#
# #1615 names pinning the runner's Xcode as its cheapest untested lever, and
# says explicitly not to assume it either way. This runs the five skipped
# snapshot suites once per Xcode installed on the runner image and prints the
# failure count for each, so the answer is measured rather than argued.
#
# Deliberately NOT in macos-swift.yml: `Tests/ImageSnapshotCIScopeTests.swift`
# parses that file for `swift test` invocations and requires exactly one gating
# and one filtered command, which is a property worth keeping rather than
# loosening for a one-off experiment.

on:
  push:
    branches: ["fix/1615-snapshot-pixel-evidence"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Run the skipped suites under every installed Xcode
        shell: bash
        run: |
          # +e: GitHub's `shell: bash` sets -e, and every iteration below runs
          # a suite that is EXPECTED to fail. The first attempt probed exactly
          # one Xcode and then died. Same defect as #1629.
          set +e
          set -u
          sw_vers
          echo "installed Xcodes:"; ls -d /Applications/Xcode*.app
          for xc in /Applications/Xcode*.app; do
            [ -d "$xc" ] || continue
            echo "=============================================================="
            echo "== $xc"
            sudo xcode-select -s "$xc" || { echo "could not select $xc"; continue; }
            xcodebuild -version
            swift --version
            ( cd platforms/macos && rm -rf .build && \
              swift test --skip LauncherTestHarness --skip LauncherHarnessTests \
                         --filter BackchannelRulesViewSnapshotTests \
                         --filter GroupViewSnapshotTests \
                         --filter HistoryViewSnapshotTests \
                         --filter RasterPrimitiveEvidenceTests \
                         --filter SessionListUnappliedGrantsWiringTests \
                         --filter SessionRowSnapshotTests 2>&1 ) \
              | grep -aE "raster-primitive |does not match reference|Executed [0-9]+ tests, with" \
              | tail -40
            echo "== end $xc"
          done
