name: Update CodeScene Badge

on:
  push:
    branches: [main]
  workflow_dispatch:

# The badge is published by PATCHing a gist with a separate GIST_SECRET PAT,
# not the workflow token — so the default token needs checkout and nothing more.
permissions:
  contents: read

jobs:
  badge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Fetch current code health score
        env:
          CODESCENE_API_TOKEN: ${{ secrets.CODESCENE_API_TOKEN }}
          CODESCENE_PROJECT_ID: "82148"
        run: |
          # high_level_metrics.current_score is an alias for
          # hotspots_code_health_now_weighted_average (hotspot files only,
          # i.e. the most-frequently-changed ones) — NOT the whole-codebase
          # score shown on the CodeScene dashboard. That's
          # code_health_weighted_average_current. The two normally track
          # closely, but diverge sharply after a PR that concentrates its
          # changes in hotspot files (see #901's cognitive-complexity pass,
          # which showed a false ~1-point badge drop while the dashboard's
          # real score improved).
          SCORE=$(tools/codescene-report.sh "analyses/latest" | jq -r '.high_level_metrics.code_health_weighted_average_current')
          if [ -z "$SCORE" ] || [ "$SCORE" = "null" ]; then
            echo "::error::could not read high_level_metrics.code_health_weighted_average_current from analyses/latest"
            exit 1
          fi
          echo "SCORE=$SCORE" >> "$GITHUB_ENV"
          echo "Code health: ${SCORE}/10"

      - name: Determine badge color
        run: |
          # CodeScene's own bands: 8-10 healthy, 4-7.99 warning, 0-3.99 alert.
          whole="${SCORE%.*}"
          if [ "$whole" -ge 8 ]; then
            COLOR="brightgreen"
          elif [ "$whole" -ge 4 ]; then
            COLOR="yellow"
          else
            COLOR="red"
          fi
          echo "COLOR=$COLOR" >> "$GITHUB_ENV"

      - name: Update Gist with code health score
        env:
          GIST_SECRET: ${{ secrets.GIST_SECRET }}
          # Reuses the same badges gist as coverage.yml (adds a second file to it).
          COVERAGE_GIST_ID: ${{ secrets.COVERAGE_GIST_ID }}
        run: |
          if [ -z "$GIST_SECRET" ]; then
            echo "::error::GIST_SECRET is not set in repository secrets, so the code health badge could not be published at all. The gist still holds its previous codescene.json and README's CodeScene badge renders the previous score."
            exit 1
          fi
          if [ -z "$COVERAGE_GIST_ID" ]; then
            echo "::error::COVERAGE_GIST_ID is not set in repository secrets, so there is no gist for the code health badge to be published to. README's CodeScene badge renders the previous score."
            exit 1
          fi
          MESSAGE=$(printf '%.1f/10' "$SCORE")
          BADGE_JSON="{\"schemaVersion\":1,\"label\":\"code health\",\"message\":\"${MESSAGE}\",\"color\":\"${COLOR}\"}"
          jq -n --arg content "$BADGE_JSON" '{"files":{"codescene.json":{"content":$content}}}' > gist-payload.json

          # `|| curl_status=$?`, not a bare `$(curl …)` (#1710). curl exits
          # non-zero when no response was received (DNS/TLS/connect failure),
          # and this step declares no `shell:`, so the runner gives it
          # `bash -e {0}` — under which an assignment from a failing command
          # substitution ABORTS the step at this line. Neither the `echo` nor
          # the refusal below was ever reached, so a transport failure came
          # out as a red X over a log with no `HTTP …` line and no annotation
          # in it. Measured in this step's own derived shell: exit 6, silent.
          # The comment that used to sit here documented curl's `000` code as
          # if the refusal read it; errexit made that branch unreachable for
          # the whole of this step's life, and a comment describing a branch
          # that cannot execute is why nobody re-checked it. It is reachable
          # now — `curl_status` carries the failure and `000` is what
          # `$http_code` holds when it fires.
          curl_status=0
          http_code=$(curl -sS -o gist-response.json -w '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            --retry 3 --retry-delay 2 --retry-all-errors \
            -X PATCH \
            -H "Authorization: token $GIST_SECRET" \
            -H "Content-Type: application/json" \
            -d @gist-payload.json \
            "https://api.github.com/gists/$COVERAGE_GIST_ID") || curl_status=$?
          echo "HTTP $http_code (curl exit $curl_status)"
          # ...and the SHAPE of `$http_code` is decided before it is compared.
          # `[ "" -lt 200 ]` errors and evaluates FALSE, and so does the other
          # disjunct, so execution fell through to the success path — errexit
          # does not save it, a failing command in an `if` condition being
          # exempt. Measured: two `integer expression expected` lines and
          # exit 0, i.e. the job reporting the badge published on a run where
          # the gist was never written. Same shape as ars.yml's step, so the
          # three gist-writing workflows converge on one guard rather than
          # three.
          case "$http_code" in
            ''|*[!0-9]*) http_code_usable=0 ;;
            *)           http_code_usable=1 ;;
          esac
          if [ "$curl_status" -ne 0 ] || [ "$http_code_usable" -ne 1 ] || [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::the code health badge gist update FAILED (HTTP $http_code, curl exit $curl_status), so the gist still holds its previous codescene.json and README's CodeScene badge renders the previous score."
            if [ -s gist-response.json ]; then
              cat gist-response.json
            else
              echo "(no response body — likely a transport failure)"
            fi
            exit 1
          fi
          echo "Published code health badge to gist: $MESSAGE"
